[project]
name = "sheet-practice"
version = "0.1.0"
description = "Local play-along practice app for string parts. Scores are not included."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "homr>=0.7.0",
    "lxml>=6.1.3",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = ["playwright>=1.40"]
